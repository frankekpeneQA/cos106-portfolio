<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Sample API response screenshot</title>
  <desc id="desc">A mock API client showing GET products slash 1 and a 200 OK JSON response.</desc>
  <rect width="1000" height="560" rx="18" fill="#f7fbff"/>
  <rect width="1000" height="58" rx="18" fill="#071b33"/>
  <circle cx="28" cy="29" r="7" fill="#ff766d"/><circle cx="52" cy="29" r="7" fill="#f2bd70"/><circle cx="76" cy="29" r="7" fill="#18b6a4"/>
  <text x="110" y="36" fill="#d7edf5" font-family="Arial,sans-serif" font-size="20" font-weight="700">API Test Runner</text>
  <rect x="34" y="90" width="130" height="48" rx="7" fill="#e3f7f4"/><text x="63" y="121" fill="#087b72" font-family="Arial,sans-serif" font-size="20" font-weight="700">GET</text>
  <rect x="180" y="90" width="786" height="48" rx="7" fill="#fff" stroke="#c9d9e5"/><text x="200" y="121" fill="#172b42" font-family="monospace" font-size="19">https://api.example.test/products/1</text>
  <rect x="34" y="162" width="932" height="54" rx="7" fill="#e8f5f7"/><text x="56" y="197" fill="#0b4663" font-family="Arial,sans-serif" font-size="20" font-weight="700">Response</text><text x="794" y="197" fill="#087b72" font-family="Arial,sans-serif" font-size="20" font-weight="700">200 OK</text>
  <rect x="34" y="240" width="932" height="278" rx="7" fill="#071b33"/>
  <text x="62" y="280" fill="#8be7df" font-family="monospace" font-size="21">{</text>
  <text x="92" y="320" fill="#f2bd70" font-family="monospace" font-size="21">"id"</text><text x="156" y="320" fill="#fff" font-family="monospace" font-size="21">: 1,</text>
  <text x="92" y="360" fill="#f2bd70" font-family="monospace" font-size="21">"title"</text><text x="206" y="360" fill="#8be7df" font-family="monospace" font-size="21">: "Sample Product"</text>
  <text x="92" y="400" fill="#f2bd70" font-family="monospace" font-size="21">"price"</text><text x="206" y="400" fill="#fff" font-family="monospace" font-size="21">: 29.99</text>
  <text x="92" y="440" fill="#f2bd70" font-family="monospace" font-size="21">"inStock"</text><text x="239" y="440" fill="#8be7df" font-family="monospace" font-size="21">: true</text>
  <text x="62" y="480" fill="#8be7df" font-family="monospace" font-size="21">}</text>
</svg>
