<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Frank Ekpene through the portfolio website form." />
    <meta name="keywords" content="Frank Ekpene contact, send message, software engineering contact" />
    <title>Contact | Frank Ekpene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">Frank Ekpene</a>

        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation">
          Menu
        </button>

        <nav id="main-nav" aria-label="Main navigation">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="planner.html">Planner</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
          </ul>
        </nav>

        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <main id="main-content" class="container page-shell">
      <section class="section-heading">
        <p class="eyebrow">Let’s connect</p>
        <h1>Contact me</h1>
      </section>

      <section class="panel form-panel">
        <form id="contactForm" action="https://formsubmit.co/frankekpene0@gmail.com" method="POST" novalidate>
          <input type="hidden" name="_subject" value="New message from Frank Ekpene Portfolio" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_template" value="table" />

          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" />
            <span class="error" id="nameError" aria-live="polite"></span>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" />
            <span class="error" id="emailError" aria-live="polite"></span>
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" />
            <span class="error" id="phoneError" aria-live="polite"></span>
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"></textarea>
            <span class="error" id="messageError" aria-live="polite"></span>
          </div>

          <button class="btn btn-primary" type="submit">Send message</button>
          <p id="formStatus" class="success" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>&copy; 2026 Frank Ekpene. MIVA Open University, Software Engineering.</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
