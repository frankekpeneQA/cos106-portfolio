<main id="main">
<h1>Contact me</h1>
<section class="panel">
<form id="contactForm" novalidate>
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"><span class="error" id="nameError"></span></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email"><span class="error" id="emailError"></span></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel"><span class="error" id="phoneError"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="error" id="messageError"></span></div>
<button class="btn" type="submit">Send message</button>
<p id="formStatus" class="success" role="status"></p>
</form>
</section>
</main>
