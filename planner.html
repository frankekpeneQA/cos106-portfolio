<h1>Academic planner</h1>
<section class="panel">
<form id="taskForm" novalidate>
<label for="taskInput">New task</label>
<div class="row">
<input id="taskInput" type="text" placeholder="For example: Read chapter 3" autocomplete="off">
<button class="btn" type="submit">Add task</button>
</div>
<p class="error" id="taskError" role="alert"></p>
</form>
<p id="count" aria-live="polite"></p>
<ul id="taskList" class="tasks"></ul>
<p id="empty" class="muted">No tasks yet. Add your first one above.</p>
</section>
</main>
